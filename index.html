<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Bio-Data Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(30, 41, 59, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }
    .glass-input:focus {
      background: rgba(30, 41, 59, 0.95);
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }
    .avatar-glow {
      box-shadow: 0 0 30px -5px rgba(99, 102, 241, 0.5);
    }
    @media print {
      body { background: white !important; color: black !important; }
      header, #form-panel, .no-print { display: none !important; }
      .glass { background: white !important; border: 1px solid #ddd !important; color: black !important; }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Ambient Background Glows -->
  <div class="fixed top-0 left-1/4 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
  <div class="fixed bottom-10 right-1/4 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none -z-10"></div>

  <!-- Header -->
  <header class="glass sticky top-0 z-40 border-b border-slate-800 px-6 py-4">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-camera-retro text-white"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-white flex items-center gap-2">
            BioPortfolio <span class="text-xs px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 font-medium">Pro Studio</span>
          </h1>
          <p class="text-xs text-slate-400">Personal Bio-Data & Interactive Portfolio Cards</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <span class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Live Database
        </span>
        <button onclick="loadProfiles()" class="px-3.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold border border-slate-700 transition flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> Refresh
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 md:px-8 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

      <!-- LEFT: Profile Creation Form -->
      <section id="form-panel" class="lg:col-span-5 glass rounded-3xl p-6 shadow-2xl relative">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-5">
          <h2 class="text-lg font-extrabold text-white flex items-center gap-2">
            <i class="fa-solid fa-user-pen text-indigo-400 text-sm"></i> Create Bio-Data Profile
          </h2>
          <button type="button" onclick="loadDefaultSample()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium underline">
            Load Sample Photo
          </button>
        </div>

        <form id="bioForm" onsubmit="saveProfile(event)" class="space-y-4">

          <!-- Photo Upload & Thumbnail Preview -->
          <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 flex items-center gap-4">
            <div id="form-avatar-box" class="w-16 h-16 rounded-2xl bg-slate-800 border-2 border-dashed border-indigo-500/50 flex items-center justify-center overflow-hidden shrink-0">
              <i class="fa-solid fa-image text-slate-500 text-xl" id="avatar-placeholder"></i>
              <img id="avatar-img-tag" src="" class="w-full h-full object-cover hidden" alt="Avatar" />
            </div>
            <div class="flex-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-300 mb-1">Upload Photo</label>
              <input type="file" id="photo-file" accept="image/*" onchange="handleImageUpload(event)" class="block w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer" />
            </div>
          </div>

          <!-- Full Name -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Full Name *</label>
            <input type="text" id="full_name" required placeholder="e.g. Ishaan Sharma" oninput="updateLivePreview()" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
          </div>

          <!-- DOB & Gender -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Date of Birth *</label>
              <input type="date" id="dob" required oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Gender *</label>
              <select id="gender" onchange="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white outline-none">
                <option value="Female" class="bg-slate-900">Female</option>
                <option value="Male" class="bg-slate-900">Male</option>
                <option value="Other" class="bg-slate-900">Other</option>
              </select>
            </div>
          </div>

          <!-- Phone & Email -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Mobile No. *</label>
              <input type="tel" id="mobile" required placeholder="9876543210" pattern="[0-9]{10}" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Email *</label>
              <input type="email" id="email" required placeholder="name@example.com" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
          </div>

          <!-- Education & Role -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Education *</label>
              <input type="text" id="education" required placeholder="e.g. BCA / MCA" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Profession *</label>
              <input type="text" id="profession" required placeholder="Full Stack Developer" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
          </div>

          <!-- Technical Skills -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Skills (comma-separated)</label>
            <input type="text" id="skills" placeholder="Python, FastAPI, React, Node.js, SQLite" oninput="updateLivePreview()" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
          </div>

          <!-- Short Bio -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Short Bio / About Me</label>
            <textarea id="bio" rows="2" placeholder="Passionate developer building high-performance web applications..." oninput="updateLivePreview()" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none"></textarea>
          </div>

          <!-- GitHub & LinkedIn Links -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">GitHub URL</label>
              <input type="url" id="github" placeholder="https://github.com/username" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">LinkedIn URL</label>
              <input type="url" id="linkedin" placeholder="https://linkedin.com/in/username" oninput="updateLivePreview()" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
          </div>

          <!-- Family Info -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Father's Name *</label>
              <input type="text" id="father_name" required placeholder="Father's Name" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Mother's Name *</label>
              <input type="text" id="mother_name" required placeholder="Mother's Name" class="glass-input w-full px-3 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none" />
            </div>
          </div>

          <!-- Address -->
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">City & Address *</label>
            <textarea id="address" rows="2" required placeholder="Udaipur, Rajasthan, India" class="glass-input w-full px-3.5 py-2 rounded-xl text-sm text-white placeholder:text-slate-500 outline-none"></textarea>
          </div>

          <button type="submit" class="w-full mt-2 py-3.5 px-4 rounded-xl bg-gradient-to-r from-indigo-500 via-purple-600 to-pink-500 text-white font-bold text-sm tracking-wide shadow-lg shadow-indigo-500/30 hover:opacity-95 transition-all">
            <i class="fa-solid fa-sparkles mr-1.5"></i> Save Profile to Database
          </button>
        </form>
      </section>

      <!-- RIGHT: Dynamic Preview & Saved Cards -->
      <section class="lg:col-span-7 space-y-6">

        <!-- Live Preview Card -->
        <div class="no-print">
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-xs uppercase tracking-wider text-indigo-400 font-bold flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span> Live Interactive Preview
            </span>
          </div>

          <div class="glass rounded-3xl p-6 border border-indigo-500/40 relative overflow-hidden shadow-2xl">
            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-5">
              <!-- Avatar Display -->
              <div id="preview-avatar" class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white font-black text-2xl shadow-lg avatar-glow overflow-hidden shrink-0">
                <span id="preview-initials">DP</span>
              </div>

              <div class="flex-1 text-center sm:text-left space-y-1">
                <div class="flex flex-wrap items-center justify-center sm:justify-start gap-2">
                  <h3 id="preview-name" class="text-xl font-black text-white">Full Name</h3>
                  <span id="preview-role-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">Candidate</span>
                </div>
                <p id="preview-role" class="text-sm font-semibold text-purple-300">Profession / Designation</p>
                <p id="preview-bio" class="text-xs text-slate-300 pt-1 line-clamp-2">Bio summary will display right here...</p>

                <!-- Skills Preview -->
                <div id="preview-skills-box" class="flex flex-wrap gap-1.5 pt-2 justify-center sm:justify-start">
                  <span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 text-[10px]">Skills</span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Saved Profiles Gallery -->
        <div>
          <div class="flex items-center justify-between mb-4 border-b border-slate-800 pb-2 px-1">
            <h2 class="text-lg font-extrabold text-white">Published Profiles</h2>
            <span id="profile-count" class="text-xs bg-slate-800 px-3 py-1 rounded-full text-slate-400 font-bold">0 Profiles</span>
          </div>

          <div id="profilesContainer" class="space-y-4">
            <div class="glass p-8 rounded-2xl text-center text-slate-500 text-sm">
              <i class="fa-solid fa-spinner animate-spin text-2xl mb-2 block text-indigo-400"></i>
              Loading profiles...
            </div>
          </div>
        </div>

      </section>

    </div>
  </main>

  <script>
    const API = window.location.origin;
    let base64Photo = "";

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        base64Photo = event.target.result;
        displayFormAvatar(base64Photo);
        updateLivePreview();
      };
      reader.readAsDataURL(file);
    }

    function displayFormAvatar(src) {
      const imgTag = document.getElementById("avatar-img-tag");
      imgTag.src = src;
      imgTag.classList.remove("hidden");
      document.getElementById("avatar-placeholder").classList.add("hidden");
    }

    // Helper to auto-load local profile.jpeg if in project folder
    function loadDefaultSample() {
      base64Photo = "/static/profile.jpeg";
      displayFormAvatar(base64Photo);
      updateLivePreview();
    }

    function getInitials(name) {
      if (!name) return "DP";
      const parts = name.trim().split(" ");
      return parts.length >= 2 
        ? (parts[0][0] + parts[1][0]).toUpperCase() 
        : parts[0].slice(0, 2).toUpperCase();
    }

    function updateLivePreview() {
      const name = document.getElementById("full_name").value.trim() || "Full Name";
      const role = document.getElementById("profession").value.trim() || "Profession / Designation";
      const bio = document.getElementById("bio").value.trim() || "Bio summary will display right here...";
      const skills = document.getElementById("skills").value.trim();

      document.getElementById("preview-name").innerText = name;
      document.getElementById("preview-role").innerText = role;
      document.getElementById("preview-bio").innerText = bio;

      const avatarBox = document.getElementById("preview-avatar");
      if (base64Photo) {
        avatarBox.innerHTML = `<img src="${base64Photo}" class="w-full h-full object-cover" />`;
      } else {
        avatarBox.innerHTML = `<span id="preview-initials">${getInitials(name)}</span>`;
      }

      const skillsBox = document.getElementById("preview-skills-box");
      if (skills) {
        skillsBox.innerHTML = skills.split(",").map(s => 
          `<span class="px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-[10px] font-semibold">${s.trim()}</span>`
        ).join("");
      } else {
        skillsBox.innerHTML = `<span class="px-2 py-0.5 rounded-md bg-slate-800 text-slate-400 text-[10px]">Add skills above</span>`;
      }
    }

    async function loadProfiles() {
      try {
        const res = await fetch(`${API}/biodata`);
        const data = await res.json();
        const container = document.getElementById("profilesContainer");
        document.getElementById("profile-count").innerText = `${data.length} Profiles`;

        if (!data || data.length === 0) {
          container.innerHTML = `
            <div class="glass p-8 rounded-2xl text-center text-slate-500 text-sm">
              <i class="fa-solid fa-user-astronaut text-3xl mb-2 text-indigo-400 block"></i>
              No profiles published yet. Complete the form to add one!
            </div>`;
          return;
        }

        container.innerHTML = data.map(b => {
          const initials = getInitials(b.full_name);
          const avatarHtml = b.photo 
            ? `<img src="${b.photo}" class="w-full h-full object-cover" />` 
            : `<span class="text-white font-extrabold text-lg">${initials}</span>`;

          const skillChips = b.skills 
            ? b.skills.split(",").map(s => `<span class="px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 text-[10px] font-semibold">${s.trim()}</span>`).join("")
            : "";

          return `
            <div class="glass rounded-3xl p-6 border border-slate-800/80 hover:border-indigo-500/40 transition-all shadow-xl space-y-4">
              
              <!-- Card Top -->
              <div class="flex items-start justify-between gap-4">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center overflow-hidden shadow-lg shrink-0">
                    ${avatarHtml}
                  </div>
                  <div>
                    <h3 class="text-lg font-black text-white">${b.full_name}</h3>
                    <p class="text-xs font-semibold text-purple-400">${b.profession} <span class="text-slate-500 mx-1">•</span> <span class="text-slate-400">${b.education}</span></p>
                    <div class="flex items-center gap-3 pt-1 text-xs text-slate-400">
                      ${b.github ? `<a href="${b.github}" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-github"></i> GitHub</a>` : ''}
                      ${b.linkedin ? `<a href="${b.linkedin}" target="_blank" class="hover:text-blue-400 transition"><i class="fa-brands fa-linkedin"></i> LinkedIn</a>` : ''}
                    </div>
                  </div>
                </div>

                <div class="flex items-center gap-1.5 no-print">
                  <button onclick="window.print()" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs flex items-center justify-center transition" title="Print Profile">
                    <i class="fa-solid fa-print"></i>
                  </button>
                  <button onclick="deleteProfile(${b.id})" class="w-8 h-8 rounded-lg bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 text-xs flex items-center justify-center border border-rose-500/20 transition" title="Delete">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <!-- Bio -->
              ${b.bio ? `<p class="text-xs text-slate-300 leading-relaxed bg-slate-900/40 p-3 rounded-xl border border-slate-800/60">${b.bio}</p>` : ''}

              <!-- Skills Tags -->
              ${skillChips ? `<div class="flex flex-wrap gap-1.5 pt-1">${skillChips}</div>` : ''}

              <!-- Details Grid -->
              <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 text-xs">
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] uppercase font-bold text-slate-500">Born / Gender</span>
                  <span class="text-slate-200 font-semibold">${b.dob} (${b.gender})</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] uppercase font-bold text-slate-500">Phone</span>
                  <span class="text-slate-200 font-semibold">${b.mobile}</span>
                </div>
                <div class="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800">
                  <span class="block text-[10px] uppercase font-bold text-slate-500">Email</span>
                  <span class="text-slate-200 font-semibold truncate block">${b.email}</span>
                </div>
              </div>

              <!-- Address & Family Details -->
              <div class="pt-2 border-t border-slate-800/80 flex flex-wrap items-center justify-between text-xs text-slate-400 gap-2">
                <div><i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i> ${b.address}</div>
                <div class="text-[11px] text-slate-500">Parents: ${b.father_name} & ${b.mother_name}</div>
              </div>

            </div>
          `;
        }).join("");
      } catch (err) {
        document.getElementById("profilesContainer").innerHTML = `
          <div class="p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs">
            Failed to connect to backend server. Make sure Uvicorn is running.
          </div>`;
      }
    }

    async function saveProfile(e) {
      e.preventDefault();
      const payload = {
        full_name: document.getElementById("full_name").value.trim(),
        dob: document.getElementById("dob").value,
        gender: document.getElementById("gender").value,
        mobile: document.getElementById("mobile").value.trim(),
        email: document.getElementById("email").value.trim(),
        education: document.getElementById("education").value.trim(),
        profession: document.getElementById("profession").value.trim(),
        skills: document.getElementById("skills").value.trim(),
        bio: document.getElementById("bio").value.trim(),
        github: document.getElementById("github").value.trim(),
        linkedin: document.getElementById("linkedin").value.trim(),
        father_name: document.getElementById("father_name").value.trim(),
        mother_name: document.getElementById("mother_name").value.trim(),
        address: document.getElementById("address").value.trim(),
        photo: base64Photo
      };

      try {
        const res = await fetch(`${API}/biodata`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Failed to create bio-data profile");
        }

        document.getElementById("bioForm").reset();
        base64Photo = "";
        document.getElementById("avatar-img-tag").classList.add("hidden");
        document.getElementById("avatar-placeholder").classList.remove("hidden");
        updateLivePreview();
        loadProfiles();
      } catch (err) {
        alert(err.message);
      }
    }

    async function deleteProfile(id) {
      if (!confirm("Are you sure you want to delete this profile?")) return;
      try {
        const res = await fetch(`${API}/biodata/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("Delete failed");
        loadProfiles();
      } catch (err) {
        alert(err.message);
      }
    }

    window.onload = () => {
      loadProfiles();
      updateLivePreview();
    };
  </script>
</body>
</html>
